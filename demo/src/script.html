/* ══════════════  AGENDA SIMULÉ  ══════════════ */

function dayKey(d){ return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate(); }
function hash(str){
  var h = 2166136261;
  for(var i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return (h >>> 0);
}
function isOpen(d){ return d.getDay() !== 0; }

/* Créneaux d'une journée pour un praticien — stable d'un rendu à l'autre */
function daySlots(date, docId){
  if(!isOpen(date)) return [];
  var sat = date.getDay() === 6;
  var out = [], h, m;
  var seed = hash(dayKey(date) + "|" + docId);
  var idx = 0;
  for(h = CLINIC.openHour; h < (sat ? 14 : 19); h++){
    if(!sat && h >= 13 && h < 15) continue;             /* pause déjeuner */
    for(m = 0; m < 60; m += CLINIC.slotStep){
      var label = (h<10?"0":"")+h+":"+(m===0?"00":m);
      var taken = ((seed >> (idx % 24)) ^ (seed * (idx+3))) % 10 < 5;
      var past  = isToday(date) && (h*60+m) <= (new Date().getHours()*60 + new Date().getMinutes() + 45);
      out.push({ label: label, free: !taken && !past });
      idx++;
    }
  }
  return out;
}
function isToday(d){ var n = new Date(); return d.toDateString() === n.toDateString(); }
function isTomorrow(d){ var n = new Date(Date.now()+86400000); return d.toDateString() === n.toDateString(); }

function nextDays(n){
  var out = [], d = new Date(); d.setHours(0,0,0,0);
  for(var i=0;i<n;i++){ var c = new Date(d); c.setDate(d.getDate()+i); out.push(c); }
  return out;
}
function fmtDay(d, opts){ return new Intl.DateTimeFormat(LOCALE[lang], opts).format(d); }
function dayLabel(d){
  if(isToday(d)) return t("js.today");
  if(isTomorrow(d)) return t("js.tomorrow");
  return fmtDay(d,{weekday:"long", day:"numeric", month:"long"});
}

/* Carte « prochaines disponibilités » du hero */
function renderNextSlots(){
  var host = $("#nextSlots"), html = "", shown = 0;
  nextDays(9).forEach(function(d){
    if(shown >= 3 || !isOpen(d)) return;
    var free = daySlots(d,"any").filter(function(s){ return s.free; });
    if(!free.length) return;
    shown++;
    var chips = free.slice(0,3).map(function(s){
      return '<button class="chip" type="button" data-jump="'+dayKey(d)+'|'+s.label+'">'+s.label+'</button>';
    }).join("");
    if(free.length > 3) chips += '<button class="chip" type="button" data-jump="'+dayKey(d)+'|">+'+(free.length-3)+'</button>';
    html += '<div class="slotday"><span class="d"><b>'+esc(dayLabel(d))+'</b>'+
            '<span>'+free.length+" "+(free.length>1?t("js.slotsLeft"):t("js.oneSlot"))+'</span></span>'+
            '<span class="chiprow">'+chips+'</span></div>';
  });
  host.innerHTML = html;
  $$("[data-jump]", host).forEach(function(b){
    b.addEventListener("click", function(){
      var parts = b.getAttribute("data-jump").split("|");
      jumpToBooking(parts[0], parts[1]);
    });
  });
}

      ' aria-pressed="'+(sel?"true":"false")+'">'+

      '<span class="dn">'+d.getDate()+'</span></button>';
  }).join("");
  $$("#daystrip .day").forEach(function(b){
    b.addEventListener("click", function(){
      var k = b.getAttribute("data-k");
      state.date = days.filter(function(d){ return dayKey(d) === k; })[0];
      state.time = null;
      renderDays(); renderSlots();
    });
  });
}

function renderSlots(){
  var host = $("#slots");
  if(!state.date){ host.innerHTML = '<p class="hint" style="margin:0">'+t("js.pickDay")+'</p>'; return; }
  var list = daySlots(state.date, state.doc || "any");
  var free = list.filter(function(s){ return s.free; });
  if(!free.length){ host.innerHTML = '<p class="hint" style="margin:0">'+t("js.noSlots")+'</p>'; return; }
  host.innerHTML = list.map(function(s){
    return '<button class="slot" type="button" data-h="'+s.label+'"'+(s.free?"":" disabled")+
      ' aria-pressed="'+(state.time===s.label?"true":"false")+'">'+s.label+'</button>';
  }).join("");
  $$(".slot", host).forEach(function(b){
    b.addEventListener("click", function(){
      state.time = b.getAttribute("data-h");
      renderSlots();
    });
  });
}

function recapHTML(){
  var m = state.motif !== null ? DATA[lang].motifs[state.motif][0] : "—";
  var d = docsForPicker().filter(function(x){ return x.id === state.doc; })[0];
  var when = state.date ? dayLabel(state.date) + " " + t("js.at") + " " + state.time : "—";
  return '<dl><dt>'+t("js.recapMotif")+'</dt><dd>'+esc(m)+'</dd>'+
         '<dt>'+t("js.recapDoc")+'</dt><dd>'+esc(d ? d.name : "—")+'</dd>'+
         '<dt>'+t("js.recapWhen")+'</dt><dd>'+esc(when)+'</dd></dl>';
}

function go(n){
  state.step = n;
  $$(".pane").forEach(function(p){ p.classList.toggle("on", +p.getAttribute("data-pane") === n); });
  $$("#bookSteps li").forEach(function(li){
    var i = +li.getAttribute("data-step");
    li.classList.toggle("on", i === n);
    li.classList.toggle("done", i < n);
  });
  $("#bookNav").style.display = n === 4 ? "none" : "flex";
  $("#btnBack").style.visibility = n === 0 ? "hidden" : "visible";
  $("#btnNext").textContent = n === 3 ? t("js.confirm") : t("rdv.next");
  if(n === 3) $("#recapMini").innerHTML = recapHTML();
}

function validPhone(v){ return /^0[5-7][0-9\s.-]{8,}$/.test(v.trim()) && v.replace(/\D/g,"").length === 10; }

function submitBooking(){
  var name = $("#fName"), tel = $("#fTel");
  var nameOk = name.value.trim().length > 1;
  var telOk  = validPhone(tel.value);
  name.parentNode.classList.toggle("bad", !nameOk);
  tel.parentNode.classList.toggle("bad", !telOk);
  if(!nameOk || !telOk) return;

  $("#recapFull").innerHTML = recapHTML().replace("</dl>",
    '<dt>'+t("js.recapWho")+'</dt><dd>'+esc(name.value.trim())+' · '+esc(tel.value.trim())+'</dd></dl>');

  var m = state.motif !== null ? DATA[lang].motifs[state.motif][0] : "";
  var d = docsForPicker().filter(function(x){ return x.id === state.doc; })[0];
  var msg = t("js.waMsg") + "\n" +
    "— " + t("js.recapMotif") + " : " + m + "\n" +
    "— " + t("js.recapDoc")   + " : " + (d ? d.name : "") + "\n" +
    "— " + t("js.recapWhen")  + " : " + (state.date ? dayLabel(state.date) + " " + t("js.at") + " " + state.time : "") + "\n" +
    "— " + t("js.recapWho")   + " : " + name.value.trim() + " · " + tel.value.trim() +
    ($("#fMsg").value.trim() ? "\n— " + $("#fMsg").value.trim() : "");
  $("#waLink").href = "https://wa.me/" + CLINIC.whatsapp + "?text=" + encodeURIComponent(msg);
  go(4);
}

function jumpToBooking(key, time){
  var d = nextDays(9).filter(function(x){ return dayKey(x) === key; })[0];
  if(d){ state.date = d; state.time = time || null; }
  if(state.motif === null) state.motif = 0;
  if(state.doc === null) state.doc = "any";
  renderMotifs(); renderPraticiens(); renderDays(); renderSlots();
  go(2);
  $("#rdv").scrollIntoView({ behavior: prefersReduced() ? "auto" : "smooth", block:"start" });
}

$("#btnNext").addEventListener("click", function(){
  if(state.step === 0 && state.motif === null) return;
  if(state.step === 1 && !state.doc) return;
  if(state.step === 2 && !state.time) return;
  if(state.step === 3) return submitBooking();
  go(state.step + 1);
});
$("#btnBack").addEventListener("click", function(){ if(state.step > 0) go(state.step - 1); });

/* ══════════════  AVANT / APRÈS  ══════════════ */

/* Contour d'une dent : coins supérieurs peu arrondis, bord libre arrondi */
function toothPath(w, h, rt, rb){
  var hw = w / 2;
  return "M" + (-hw + rt) + " 0" +
    "h" + (w - 2*rt) + "a" + rt + " " + rt + " 0 0 1 " + rt + " " + rt +
    "v" + (h - rt - rb) + "a" + rb + " " + rb + " 0 0 1 " + (-rb) + " " + rb +
    "h" + (-(w - 2*rb)) + "a" + rb + " " + rb + " 0 0 1 " + (-rb) + " " + (-rb) +
    "v" + (-(h - rt - rb)) + "a" + rt + " " + rt + " 0 0 1 " + rt + " " + (-rt) + "z";
}

function smile(after){
  var sfx = after ? "A" : "B";
  var i, teeth = "";

  /* Largeurs réelles d'une arcade : incisives centrales au milieu, molaires aux extrémités */
  var widths = [30, 34, 38, 41, 50, 50, 41, 38, 34, 30];
  var total  = widths.reduce(function(a,b){ return a + b; }, 0);
  var startX = 260 - total / 2;

  /* Décalages appliqués uniquement au « avant » : encombrement antérieur */
  var rot   = [ -6, 4, -3, 9, -7, 6, -4, 5, -7, 3 ];
  var dy    = [  4, 2, -3, 7, -2,  5, -4, 3,  2, 5 ];
  var dx    = [  0, 1, -3, -5, -3, 4, 3, -2, 1, 0 ];

  var x = startX;
  for(i = 0; i < 10; i++){
    var w   = widths[i];
    var mid = Math.abs(i - 4.5);                 /* 0.5 au centre → 4.5 aux extrémités */
    var cx  = x + w / 2 + (after ? 0 : dx[i]);
    var gum = 94 + mid * 3.2;                    /* la gencive remonte vers le centre */
    var h   = 84 - mid * 6.4;                    /* les dents raccourcissent vers le fond */
    var y   = gum + (after ? 0 : dy[i]);
    var r   = after ? 0 : rot[i] * 0.6;
    teeth += '<g transform="translate('+cx.toFixed(1)+','+y.toFixed(1)+') rotate('+r.toFixed(1)+')">'+
      '<path d="'+toothPath(w, h, 5, Math.min(w*0.34, 11))+'" fill="url(#en'+sfx+')" stroke="'+(after?"#D9E1DC":"#C4AE81")+'" stroke-width="1"/>'+
      '</g>';
    x += w;
  }

  /* Éclat sur l'incisive centrale gauche, visible avant traitement */
  if(!after){
    teeth += '<path d="M239 104 l22 0 l-22 20 z" fill="#D3BF92"/>';
  }

  /* Arcade inférieure : à peine visible, coupée par la lèvre */
  var lower = "";
  var lx = 260 - 8 * 25;
  for(i = 0; i < 16; i++){
    var lmid = Math.abs(i - 7.5);
    var ly = 214 - lmid * 2.4;
    lower += '<path transform="translate('+(lx + 12.5)+','+ly+')" d="'+toothPath(24, 44, 9, 4)+'" '+
      'fill="'+(after ? "#EFF1EC" : "#DACBA6")+'" stroke="'+(after ? "#D9E1DC" : "#C4AE81")+'" stroke-width=".8"/>';
    lx += 25;
  }
  lower = '<g opacity=".82">'+lower+'</g>';

  var lips = "M44 132 C 138 62, 382 62, 476 132 C 428 256, 92 256, 44 132 Z";

  return '<svg viewBox="0 0 520 340" role="img" aria-label="'+(after ? "après" : "avant")+'">'+
    '<defs>'+
      '<clipPath id="mouth'+sfx+'"><path d="'+lips+'"/></clipPath>'+
      '<linearGradient id="en'+sfx+'" x1="0" y1="0" x2="0" y2="1">'+
        '<stop offset="0" stop-color="'+(after ? "#FFFFFF" : "#E3D3AC")+'"/>'+
        '<stop offset=".55" stop-color="'+(after ? "#FBFCFA" : "#EFE4C8")+'"/>'+
        '<stop offset="1" stop-color="'+(after ? "#EDF1EE" : "#F3ECD8")+'"/>'+
      '</linearGradient>'+
      '<linearGradient id="gum'+sfx+'" x1="0" y1="0" x2="0" y2="1">'+
        '<stop offset="0" stop-color="'+(after ? "#C98F88" : "#B87F79")+'"/>'+
        '<stop offset="1" stop-color="'+(after ? "#B0736C" : "#9E635D")+'"/>'+
      '</linearGradient>'+
      '<radialGradient id="cav'+sfx+'" cx=".5" cy=".42" r=".62">'+
        '<stop offset="0" stop-color="#4A2A2C"/><stop offset="1" stop-color="#2A1517"/>'+
      '</radialGradient>'+
    '</defs>'+
    '<g clip-path="url(#mouth'+sfx+')">'+
      '<rect width="520" height="340" fill="url(#cav'+sfx+')"/>'+
      '<ellipse cx="260" cy="22" rx="240" ry="120" fill="url(#gum'+sfx+')"/>'+
      lower+
      '<rect y="196" width="520" height="144" fill="#1E0F11" opacity=".28"/>'+
      teeth+
      '<ellipse cx="260" cy="300" rx="180" ry="58" fill="#160A0C" opacity=".5"/>'+
    '</g>'+
    '<path d="'+lips+'" fill="none" stroke="var(--line-strong)" stroke-width="2.5"/>'+
    '</svg>';
}

function setupBA(){
  $("#baBefore").innerHTML = smile(false);
  $("#baAfter").innerHTML  = smile(true);
  var range = $("#baRange"), afterL = $("#baAfter"), handle = $("#baHandle");
  function apply(v){
    afterL.style.clipPath = "inset(0 0 0 " + v + "%)";
    handle.style.left = v + "%";
  }
  range.addEventListener("input", function(){ apply(range.value); });
  apply(range.value);
}

/* ══════════════  MOTIF ZELLIGE  ══════════════ */

function drawZellige(){
  var c = $("#zellige");
  if(!c) return;
  var host = c.parentNode;
  var w = host.offsetWidth, h = host.offsetHeight;
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  c.width = w * dpr; c.height = h * dpr;
  var g = c.getContext("2d");
  g.scale(dpr, dpr);
  g.clearRect(0,0,w,h);

  var cs = getComputedStyle(document.body);
  var jade  = cs.getPropertyValue("--jade").trim()  || "#1F6E5E";
  var brass = cs.getPropertyValue("--brass").trim() || "#A9762F";
  var S = 78, r = S * 0.42;

  for(var y = -S; y < h + S; y += S){
    for(var x = -S; x < w + S; x += S){
      var col = Math.round(x / S), row = Math.round(y / S);
      var accent = ((col + row * 2) % 7 === 0);
      g.strokeStyle = accent ? brass : jade;
      g.globalAlpha = accent ? 0.20 : 0.11;
      g.lineWidth = 1;
      /* étoile à huit branches = deux carrés superposés */
      for(var k = 0; k < 2; k++){
        g.save();
        g.translate(x + S/2, y + S/2);
        g.rotate(k * Math.PI / 4);
        g.beginPath();
        g.rect(-r, -r, r*2, r*2);
        g.stroke();
        g.restore();
      }
      /* petit losange de liaison */
      g.globalAlpha = accent ? 0.16 : 0.07;
      g.beginPath();
      g.moveTo(x, y + S/2); g.lineTo(x + S/2, y); g.lineTo(x + S, y + S/2); g.lineTo(x + S/2, y + S);
      g.closePath(); g.stroke();
    }
  }
  g.globalAlpha = 1;
  c.style.webkitMaskImage = c.style.maskImage =
    "radial-gradient(88% 78% at 74% 26%, #000 0%, #000 20%, transparent 72%)";
}

/* ══════════════  DIVERS  ══════════════ */

function prefersReduced(){
  return window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
}

/* apparition au défilement */
function setupReveal(){
  if(!("IntersectionObserver" in window) || prefersReduced()){
    $$(".rv").forEach(function(el){ el.classList.add("in"); });
    return;
  }
  var io = new IntersectionObserver(function(entries){
    entries.forEach(function(e){
      if(e.isIntersecting){ e.target.classList.add("in"); io.unobserve(e.target); }
    });
  }, { rootMargin: "0px 0px -8% 0px", threshold: 0.06 });
  $$(".rv").forEach(function(el){ io.observe(el); });
}

/* barre de navigation */
var nav = $("#nav");
window.addEventListener("scroll", function(){
  nav.classList.toggle("stuck", window.scrollY > 8);
}, { passive:true });

/* tiroir mobile */
var drawer = $("#drawer"), burger = $("#burger");
function setDrawer(open){
  drawer.classList.toggle("open", open);
  burger.setAttribute("aria-expanded", open ? "true" : "false");
  document.body.style.overflow = open ? "hidden" : "";
}
burger.addEventListener("click", function(){ setDrawer(true); });
$("#closeDrawer").addEventListener("click", function(){ setDrawer(false); });
$$("#drawer a").forEach(function(a){ a.addEventListener("click", function(){ setDrawer(false); }); });
document.addEventListener("keydown", function(e){ if(e.key === "Escape") setDrawer(false); });

/* défilement fluide */
$$('a[href^="#"]').forEach(function(a){
  a.addEventListener("click", function(e){
    var id = a.getAttribute("href");
    if(id.length < 2) return;
    var target = document.querySelector(id);
    if(!target) return;
    e.preventDefault();
    target.scrollIntoView({ behavior: prefersReduced() ? "auto" : "smooth", block:"start" });
    history.replaceState(null, "", id);
  });
});

/* ══════════════  LANGUE  ══════════════ */

function applyLang(next){
  lang = next;
  root.setAttribute("lang", next);
  root.setAttribute("dir", next === "ar" ? "rtl" : "ltr");
  $$("[data-i18n]").forEach(function(el){
    var k = el.getAttribute("data-i18n");
    var v = (STR[lang] && STR[lang][k]);
    if(v === undefined) v = STR.fr[k];
    if(v !== undefined) el.innerHTML = v;
  });
  $$(".langs button").forEach(function(b){
    b.setAttribute("aria-pressed", b.getAttribute("data-lang") === next ? "true" : "false");
  });
  renderServices(); renderTeam(); renderPrices(); renderQuotes(); renderFaq(); renderHours();
  renderNextSlots(); renderMotifs(); renderPraticiens(); renderDays(); renderSlots();
  go(state.step);
  try{ localStorage.setItem("nacre-lang", next); }catch(e){}
}
$$(".langs button").forEach(function(b){
  b.addEventListener("click", function(){ applyLang(b.getAttribute("data-lang")); });
});

/* ══════════════  DÉMARRAGE  ══════════════ */

var saved = null;
try{ saved = localStorage.getItem("nacre-lang"); }catch(e){}
applyLang(saved && STR[saved] ? saved : "fr");
setupBA();
setupReveal();
drawZellige();

var rt;
window.addEventListener("resize", function(){
  clearTimeout(rt);
  rt = setTimeout(drawZellige, 180);
});
if(window.matchMedia){
  var mq = window.matchMedia("(prefers-color-scheme: dark)");
  (mq.addEventListener ? mq.addEventListener.bind(mq,"change") : mq.addListener.bind(mq))(function(){
    setTimeout(drawZellige, 60);
  });
}
})();
</script>
