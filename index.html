<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#05060d" />
  <meta name="description" content="Hunter Ascension — a Solo Leveling inspired 2D RPG where logging real-life habits levels up your hunter." />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Hunter Ascension</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%2305060d'/><circle cx='16' cy='16' r='9' fill='%2338bdf8'/><circle cx='16' cy='16' r='4' fill='%23e0f2fe'/></svg>" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="game-root">
    <!-- Phaser mounts its canvas here -->
    <div id="game-canvas"></div>

    <!-- DOM UI overlay: HUD, panels, touch controls -->
    <div id="ui-layer">
      <div id="hud" class="hud">
        <div class="hud__portrait">
          <img id="hud-portrait" alt="" />
          <span id="hud-rank" class="rank-badge">E</span>
        </div>

        <div class="hud__bars">
          <div class="hud__identity">
            <span id="hud-name">Youssef</span>
            <span id="hud-level" class="hud__level">Lv 1</span>
            <span id="hud-rank-name" class="hud__ranktext">E-Rank Hunter</span>
          </div>

          <div class="bar bar--hp" title="Health">
            <div id="bar-hp-fill" class="bar__fill"></div>
            <span id="bar-hp-text" class="bar__text">100 / 100</span>
          </div>

          <div class="bar bar--xp" title="Experience">
            <div id="bar-xp-fill" class="bar__fill"></div>
            <span id="bar-xp-text" class="bar__text">0 / 120 XP</span>
          </div>
        </div>

        <div class="hud__right">
          <div class="gold" title="Gold">
            <img id="gold-icon" alt="" />
            <span id="hud-gold">0</span>
          </div>
          <div id="hud-location" class="hud__location">Ascension Town</div>
          <div id="hud-save" class="hud__save">saved</div>
        </div>
      </div>

      <nav id="hud-buttons" class="hud-buttons">
        <button class="hbtn" data-panel="quests" type="button" title="Daily Quests (Q)">
          <span class="hbtn__icon">📜</span><span class="hbtn__label">Quests</span>
          <span id="quest-badge" class="hbtn__badge hidden">0</span>
        </button>
        <button class="hbtn" data-panel="inventory" type="button" title="Inventory (I)">
          <span class="hbtn__icon">🎒</span><span class="hbtn__label">Bag</span>
        </button>
        <button class="hbtn" data-panel="stats" type="button" title="Status (C)">
          <span class="hbtn__icon">📊</span><span class="hbtn__label">Status</span>
          <span id="stat-badge" class="hbtn__badge hidden">0</span>
        </button>
        <button class="hbtn" data-panel="menu" type="button" title="System (Esc)">
          <span class="hbtn__icon">⚙️</span><span class="hbtn__label">System</span>
        </button>
      </nav>

      <!-- Mobile virtual controls -->
      <div id="touch-controls" class="touch hidden">
        <div id="touch-stick" class="stick">
          <div id="touch-stick-knob" class="stick__knob"></div>
        </div>
        <div class="touch__actions">
          <button id="touch-interact" class="tbtn tbtn--interact" type="button">E</button>
          <button id="touch-attack" class="tbtn tbtn--attack" type="button">⚔</button>
        </div>
      </div>

      <div id="toasts" class="toasts"></div>

      <div id="modal-root" class="modal-root hidden">
        <div class="modal-backdrop" data-close="1"></div>
        <div class="modal" role="dialog" aria-modal="true">
          <header class="modal__head">
            <h2 id="modal-title">Title</h2>
            <button id="modal-close" class="modal__close" type="button" aria-label="Close">✕</button>
          </header>
          <div id="modal-body" class="modal__body"></div>
          <footer id="modal-actions" class="modal__actions"></footer>
        </div>
      </div>

      <div id="levelup" class="levelup hidden">
        <div class="levelup__ring"></div>
        <div class="levelup__text">
          <span class="levelup__title">LEVEL UP</span>
          <span id="levelup-level" class="levelup__level">Lv 2</span>
          <span id="levelup-sub" class="levelup__sub">+3 stat points</span>
        </div>
      </div>
    </div>

    <div id="boot-screen" class="boot">
      <div class="boot__inner">
        <h1 class="boot__title">HUNTER<span>ASCENSION</span></h1>
        <p class="boot__sub">Arise.</p>
        <p id="boot-status" class="boot__status">Summoning the gate…</p>
      </div>
    </div>
  </div>

  <noscript>
    <p style="color:#e2e8f0;font-family:sans-serif;padding:2rem">
      Hunter Ascension needs JavaScript enabled to run.
    </p>
  </noscript>

  <!-- Engine (vendored so the game runs fully offline / from file://) -->
  <script src="vendor/phaser.min.js"></script>

  <!-- Data -->
  <script src="data/config.js"></script>
  <script src="data/ranks.js"></script>
  <script src="data/items.js"></script>
  <script src="data/enemies.js"></script>
  <script src="data/quests.js"></script>
  <script src="data/dungeons.js"></script>

  <!-- Systems -->
  <script src="systems/EventBus.js"></script>
  <script src="systems/SaveSystem.js"></script>
  <script src="systems/PlayerState.js"></script>
  <script src="systems/InventorySystem.js"></script>
  <script src="systems/QuestSystem.js"></script>
  <script src="systems/CombatSystem.js"></script>
  <script src="systems/DungeonSystem.js"></script>
  <script src="systems/TextureFactory.js"></script>

  <!-- UI -->
  <script src="ui/Toast.js"></script>
  <script src="ui/Modal.js"></script>
  <script src="ui/TouchControls.js"></script>
  <script src="ui/QuestPanel.js"></script>
  <script src="ui/InventoryPanel.js"></script>
  <script src="ui/StatsPanel.js"></script>
  <script src="ui/HUD.js"></script>

  <!-- Scenes -->
  <script src="scenes/BaseWorldScene.js"></script>
  <script src="scenes/BootScene.js"></script>
  <script src="scenes/TownScene.js"></script>
  <script src="scenes/DungeonScene.js"></script>

  <!-- Bootstrap -->
  <script src="main.js"></script>
</body>
</html>
